name: Laser-D CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
            host-compiler: dmd
            compiler: generated/linux/release/64/dmd
            distribution-platform: linux
            distribution-compiler: laser-d
          - name: Windows x86-64
            os: windows-2025
            host-compiler: dmd
            compiler: generated/windows/release/64/dmd.exe
            distribution-platform: windows
            distribution-compiler: laser-d.exe
          - name: macOS x86-64
            os: macos-15-intel
            host-compiler: ldc
            compiler: generated/osx/release/64/dmd
            distribution-platform: macos
            distribution-compiler: laser-d

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out Laser-D
        uses: actions/checkout@v6

      - name: Install the host D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.host-compiler }}

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Preserve the host compiler
        run: |
          echo "HOST_DMD=${DMD}" >> "${GITHUB_ENV}"
          "${DMD}" --version

      - name: Build Laser-D
        run: '"${DMD}" -i -run compiler/src/build.d dmd'

      - name: Check the Laser-D executable
        run: '"${{ matrix.compiler }}" --version'

      - name: Run the Laser-D test suite
        working-directory: compiler/test
        run: '"${DMD}" -i -run run.d laser-d'

      - name: Test the Laser-D standard library
        run: '"${{ matrix.compiler }}" -conf= -Ilibrary -run library/test/core_stdc.d'

      - name: Build the Laser-D distribution
        run: dub run dmd:distribution

      - name: Test the staged Laser-D distribution
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          DIST_ROOT="dist/laser-d-${VERSION}-${{ matrix.distribution-platform }}-x86_64"
          "${DIST_ROOT}/bin/${{ matrix.distribution-compiler }}" \
            -run library/test/core_stdc.d

      - name: Upload the Laser-D distribution
        uses: actions/upload-artifact@v4
        with:
          name: laser-d-${{ matrix.distribution-platform }}-x86_64
          path: dist/*.zip
          if-no-files-found: error

      - name: Install Python for documentation checks
        if: runner.os == 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify generated Markdown documentation
        if: runner.os == 'Linux'
        run: |
          python tools/ddoc_to_markdown.py
          git diff --exit-code -- spec-markdown

      - name: Check for whitespace errors
        if: runner.os == 'Linux'
        run: git diff --check
