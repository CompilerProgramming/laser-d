name: Laser-D CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
            host-compiler: dmd
            compiler: laserd
            distribution-platform: linux
          - name: Windows x86-64
            os: windows-2025
            host-compiler: dmd
            compiler: laserd.exe
            distribution-platform: windows
          - name: macOS x86-64
            os: macos-15-intel
            host-compiler: ldc
            compiler: laserd
            distribution-platform: macos

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out Laser-D
        uses: actions/checkout@v6

      - name: Install the host D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.host-compiler }}

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Preserve the host compiler
        run: |
          echo "HOST_DMD=${DMD}" >> "${GITHUB_ENV}"
          "${DMD}" --version

      - name: Build Laser-D
        run: dub build dmd:compiler --build=release --compiler="${DMD}"

      - name: Check the Laser-D executable
        run: '"./${{ matrix.compiler }}" --version'

      - name: Run the Laser-D test suite
        working-directory: compiler/test
        run: |
          LASERD_COMPILER="${GITHUB_WORKSPACE}/${{ matrix.compiler }}" \
            "${DMD}" -i -run run.d laser-d

      - name: Test the Laser-D standard library
        run: '"./${{ matrix.compiler }}" -conf= -Ilibrary -run library/test/core_stdc.d'

      - name: Configure the Laser-D standard library
        run: |
          cmake -S library -B generated/cmake-library \
            -DCMAKE_BUILD_TYPE=Release \
            -DLASERD_COMPILER="${GITHUB_WORKSPACE}/${{ matrix.compiler }}"

      - name: Build the Laser-D standard library
        run: cmake --build generated/cmake-library --config Release

      - name: Test C and Laser-D interoperability
        run: |
          ctest --test-dir generated/cmake-library \
            --build-config Release \
            --output-on-failure

      - name: Build the Laser-D distribution
        run: |
          cmake --build generated/cmake-library \
            --config Release \
            --target package

      - name: Upload the Laser-D distribution
        uses: actions/upload-artifact@v4
        with:
          name: laser-d-${{ matrix.distribution-platform }}-x86_64
          path: dist/*.zip
          if-no-files-found: error

      - name: Install Python for documentation checks
        if: runner.os == 'Linux'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify generated Markdown documentation
        if: runner.os == 'Linux'
        run: |
          python tools/ddoc_to_markdown.py
          git diff --exit-code -- spec-markdown

      - name: Check for whitespace errors
        if: runner.os == 'Linux'
        run: git diff --check
